org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Cible. Minecraft 26.2 impose Java 25 et Gradle >= 9.1.
# La table d'installation NeoForge qui indique Java 21 est obsolete : c'est le
# primer 26.1 qui fait foi (le JDK est passe de 21 a 25 a la frontiere 1.21.11 -> 26.1).
minecraft_version=26.2
minecraft_version_range=[26.2,27)
neo_version=26.2.0.93
neo_version_range=[26.2.0.93,)
loader_version_range=[1,)
java_version=25

# Identite du mod
mod_id=dohy
mod_name=DoHy
mod_version=0.1.0
mod_group_id=fr.atraxterra.dohy
mod_authors=AtraxTerra
mod_license=All Rights Reserved
mod_description=Economie et progression pour une partie solo : monnaie, shop a prix dynamiques, skills, collections et contrats.
