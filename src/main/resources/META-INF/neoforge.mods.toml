modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Arrakis reprend la planete Duna de NTM NEXT Space : charge apres lui, Berskar passe devant ses
# donnees (reglages de bruit de Duna, noms, texture de la planete).
[[dependencies.${mod_id}]]
modId = "hbmspace"
type = "optional"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"

# L'anti-chute de l'Alchimiste : Player.isStayingOnGroundSurface (voir PlayerEdgeMixin).
[[mixins]]
config = "dohy.mixins.json"
