plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id
base.archivesName = mod_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

repositories {
    mavenCentral()
}

neoForge {
    version = neo_version

    // Noms de parametres lisibles dans le decompile. Decommenter si besoin,
    // en verifiant qu'un mapping Parchment existe pour 26.2.
    // parchment {
    //     minecraftVersion = minecraft_version
    //     mappingsVersion = 'TODO'
    // }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', ''
            systemProperty 'forge.logging.console.level', 'debug'
            gameDirectory = file('run')
        }
        client {
            client()
        }
        server {
            server()
        }
        clientData {
            clientData()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // NTM NEXT arrivera ici en compileOnly (phase 10), jamais en implementation :
    // le mod doit tourner sans lui.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
    options.release = java_version as int
}

// Injecte les proprietes de gradle.properties dans les metadonnees.
tasks.named('processResources', ProcessResources).configure {
    def props = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_license            : mod_license,
            mod_description        : mod_description,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
    ]
    inputs.properties(props)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand props
    }

    // Le catalogue de prix est genere par tools/gen_prices.py et vit dans
    // data/generated/. On le copie dans le jar au lieu d'en garder une seconde
    // copie dans src/main/resources, qui finirait par deriver.
    from(rootProject.file('data/generated/prices.json')) {
        into "data/${mod_id}"
    }
    from(rootProject.file('data/collections.json')) {
        into "data/${mod_id}"
    }
    from(rootProject.file('data/skills.json')) {
        into "data/${mod_id}"
    }
    from(rootProject.file('data/contracts.json')) {
        into "data/${mod_id}"
    }
    from(rootProject.file('data/crates.json')) {
        into "data/${mod_id}"
    }
    from(rootProject.file('data/tag_prices.json')) {
        into "data/${mod_id}"
    }
    from(rootProject.file('data/economy.json')) {
        into "data/${mod_id}"
    }
    from(rootProject.file('data/museum.json')) {
        into "data/${mod_id}"
    }
    from(rootProject.file('data/upgrades.json')) {
        into "data/${mod_id}"
    }
    // Table des deblocages de metier. Generee par tools/palamod_jobs.py depuis
    // le bytecode de PalaMod, jamais ecrite a la main.
    from(rootProject.file('data/jobs.json')) {
        into "data/${mod_id}"
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
        ])
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

/*
 * Sonde d'API.
 *
 * Minecraft 26.2 et NeoForge 26.2 sont trop recents pour qu'on puisse se fier a
 * une signature de memoire, et l'environnement de dev n'a ni JDK 25 ni acces aux
 * depots Maven NeoForge. Plutot que de decouvrir chaque signature par un echec
 * de compilation (une boucle a trois minutes), cette tache liste par reflexion
 * les membres publics des classes demandees, depuis le classpath de compilation.
 *
 *   gradle apiProbe -Pprobe=net.neoforged.neoforge.attachment.AttachmentType
 *
 * Plusieurs classes separees par des virgules. Utilise par le workflow
 * .github/workflows/api-probe.yml, declenchable a la main.
 */
/*
 * Metadonnees de pack de la version ciblee.
 *
 * Les constantes SharedConstants.RESOURCE_PACK_FORMAT_MAJOR et compagnie ne sont
 * pas lisibles par reflexion : leur <clinit> touche au jeu et part en
 * NoClassDefFoundError hors runtime Minecraft. En revanche le jar de Minecraft
 * embarque son propre version.json et son propre pack.mcmeta, qui portent les
 * memes nombres. On va les y lire.
 *
 * C'est la seule facon d'ecrire pack.mcmeta sur preuve : un format invente fait
 * rejeter le pack entier, et le symptome (ecran noir, textures absentes) ne
 * ressemble pas a sa cause.
 *
 *   gradle packMeta
 */
tasks.register('packMeta') {
    group = 'verification'
    description = 'Lit version.json et pack.mcmeta dans les jars du classpath'

    def classpath = sourceSets.main.compileClasspath
    dependsOn 'compileJava'

    doLast {
        def wanted = ['version.json', 'pack.mcmeta'] as Set
        def found = 0
        // Noms de dossiers de premier niveau sous data/minecraft et
        // assets/minecraft. C'est la reponse a « loot_table ou loot_tables,
        // recipe ou recipes, tags/block ou tags/blocks » : ces noms ont change
        // plusieurs fois et un chemin faux ne fait pas echouer la compilation,
        // il fait juste que le fichier n'est jamais lu.
        def layout = [:].withDefault { new TreeSet<String>() }

        classpath.files.findAll { it.name.endsWith('.jar') && it.exists() }.each { jarFile ->
            try {
                new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                    zip.entries().each { entry ->
                        if (wanted.contains(entry.name)) {
                            println "\n${'=' * 78}\n${jarFile.name} :: ${entry.name}\n${'=' * 78}"
                            println zip.getInputStream(entry).text
                            found++
                            return
                        }
                        def match = entry.name =~ '^(data|assets)/([^/]+)/([^/]+)/'
                        if (match) {
                            layout["${match[0][1]}/${match[0][2]}"] << match[0][3]
                        }
                    }
                }
            } catch (Throwable ignored) {
                // jar illisible : on continue, l'inventaire reste utile
            }
        }

        if (found == 0) {
            println "Aucun version.json ni pack.mcmeta dans les ${classpath.files.size()} entrees du classpath."
        }

        layout.keySet().sort().each { root ->
            println "\n${'=' * 78}\nARBORESCENCE ${root}\n${'=' * 78}"
            layout[root].each { println "  ${root}/${it}/" }
        }
    }
}

/*
 * Desassemble des classes du classpath avec javap.
 *
 *   gradle bytecodeProbe -Pjavap=net.minecraft.world.level.block.BaseEntityBlock
 *
 * Pourquoi en plus de `apiProbe` : celui-la liste les membres PUBLICS par
 * reflexion, et beaucoup de crochets de Minecraft sont PROTEGES —
 * `getRenderShape`, `useWithoutItem`, `createBlockStateDefinition`. Ils sont
 * invisibles a la sonde, donc on les devine, et deviner est exactement ce que
 * ce projet evite. Surtout, la reflexion ne dit jamais ce qu'une methode
 * RETOURNE : savoir que `getRenderShape` existe n'apprend rien, savoir qu'elle
 * rend INVISIBLE change tout.
 *
 * javap repond aux deux : il montre les membres proteges et le corps des
 * methodes. C'est la meme technique qui a servi a relever la specification du
 * PalaMod depuis son jar.
 */
tasks.register('bytecodeProbe') {
    group = 'verification'
    description = 'Desassemble des classes du classpath avec javap (-Pjavap=a,b,c)'

    def classpath = sourceSets.main.compileClasspath
    def requested = (findProperty('javap') ?: '') as String
    def filter = (findProperty('member') ?: '') as String
    dependsOn 'compileJava'
    inputs.property('javap', requested)
    inputs.property('member', filter)

    doLast {
        if (!requested.trim()) {
            throw new GradleException("Rien a desassembler. Exemple : -Pjavap=java.lang.String")
        }
        def tool = "${System.getProperty('java.home')}/bin/javap"
        requested.split(',')*.trim().findAll { it }.each { name ->
            println "\n${'=' * 78}\nJAVAP ${name}\n${'=' * 78}"
            def out = new ByteArrayOutputStream()
            def err = new ByteArrayOutputStream()
            def result = exec {
                commandLine tool, '-p', '-c', '-constants', '-cp', classpath.asPath, name
                standardOutput = out
                errorOutput = err
                ignoreExitValue = true
            }
            if (result.exitValue != 0) {
                println "  (javap a echoue : ${err.toString().trim()})"
                return
            }
            def text = out.toString()
            if (!filter.trim()) {
                println text
                return
            }
            // Avec -Pmember=nom, on ne garde que les methodes dont la
            // signature contient ce nom, avec leur bytecode. Une classe comme
            // BlockBehaviour fait des milliers de lignes ; sans ce filtre la
            // reponse est illisible.
            def keep = false
            text.eachLine { line ->
                if (line ==~ /^ {2}\S.*/) {
                    keep = filter.split(',')*.trim().any { line.contains(it) }
                }
                if (keep) {
                    println line
                }
            }
        }
    }
}

tasks.register('apiProbe') {
    group = 'verification'
    description = 'Liste les membres publics de classes du classpath (-Pprobe=a,b,c)'

    def classpath = sourceSets.main.compileClasspath
    def requested = (findProperty('probe') ?: '') as String
    def packages = (findProperty('pkg') ?: '') as String
    dependsOn 'compileJava'
    inputs.property('probe', requested)
    inputs.property('pkg', packages)

    doLast {
        if (!requested.trim() && !packages.trim()) {
            throw new GradleException("Rien a sonder. Exemple : -Pprobe=java.lang.String ou -Ppkg=java.lang")
        }

        // Mode inventaire : liste les classes d'un paquet en parcourant les jars
        // du classpath. Indispensable quand on ne connait meme pas le nom exact
        // de la classe a sonder (une API remaniee, un paquet renomme).
        packages.split(',')*.trim().findAll { it }.each { pkgName ->
            def prefix = pkgName.replace('.', '/') + '/'
            def found = new TreeSet<String>()
            classpath.files.findAll { it.name.endsWith('.jar') && it.exists() }.each { jarFile ->
                try {
                    new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                        zip.entries().each { entry ->
                            def n = entry.name
                            if (n.startsWith(prefix) && n.endsWith('.class')) {
                                def rest = n.substring(prefix.length(), n.length() - 6)
                                if (!rest.contains('/')) {
                                    found << rest.replace('$', '$')
                                }
                            }
                        }
                    }
                } catch (Throwable ignored) {
                    // jar illisible : on continue, l'inventaire reste utile
                }
            }
            println "\n${'=' * 78}\nPAQUET ${pkgName} — ${found.size()} classes\n${'=' * 78}"
            found.each { println "  ${pkgName}.${it}" }
        }

        if (!requested.trim()) {
            return
        }

        def urls = classpath.files.collect { it.toURI().toURL() } as URL[]
        def loader = new URLClassLoader(urls, ClassLoader.systemClassLoader)

        requested.split(',')*.trim().findAll { it }.each { name ->
            println "\n${'=' * 78}\n${name}\n${'=' * 78}"
            Class<?> clazz
            try {
                clazz = Class.forName(name, false, loader)
            } catch (Throwable t) {
                println "  INTROUVABLE : ${t.class.simpleName}: ${t.message}"
                return
            }

            println "  kind      : ${clazz.isInterface() ? 'interface' : clazz.isEnum() ? 'enum' : clazz.isRecord() ? 'record' : 'class'}"
            println "  modifiers : ${java.lang.reflect.Modifier.toString(clazz.modifiers)}"
            if (clazz.superclass) println "  extends   : ${clazz.superclass.name}"
            if (clazz.interfaces) println "  implements: ${clazz.interfaces*.name.join(', ')}"

            def fields = clazz.declaredFields.findAll { java.lang.reflect.Modifier.isPublic(it.modifiers) }
            if (fields) {
                println "\n  -- champs --"
                fields.sort { it.name }.each { f ->
                    // Valeur affichee pour les constantes simples. Une signature
                    // seule ne repond pas aux questions du genre « quel est le
                    // pack_format de cette version » : le nom du champ est
                    // connu, c'est le nombre qu'on cherche. Limite aux
                    // primitives et aux chaines statiques finales, les seules
                    // qu'on puisse lire sans initialiser le jeu.
                    def shown = ''
                    def type = f.type
                    boolean simple = type.isPrimitive() || type == String
                    if (simple
                            && java.lang.reflect.Modifier.isStatic(f.modifiers)
                            && java.lang.reflect.Modifier.isFinal(f.modifiers)) {
                        try {
                            f.setAccessible(true)
                            def value = f.get(null)
                            shown = type == String ? " = \"${value}\"" : " = ${value}"
                        } catch (Throwable t) {
                            // Un <clinit> qui touche au jeu echoue ici : on se
                            // contente de la signature plutot que d'echouer.
                            shown = " = (non lisible : ${t.class.simpleName})"
                        }
                    }
                    println "  ${java.lang.reflect.Modifier.toString(f.modifiers)} ${f.genericType.typeName} ${f.name}${shown}"
                }
            }

            def ctors = clazz.declaredConstructors.findAll { java.lang.reflect.Modifier.isPublic(it.modifiers) }
            if (ctors) {
                println "\n  -- constructeurs --"
                ctors.each { c ->
                    println "  (${c.genericParameterTypes*.typeName.join(', ')})"
                }
            }

            def methods = (clazz.declaredMethods.toList() + clazz.methods.toList()).unique { it.toString() }.findAll { java.lang.reflect.Modifier.isPublic(it.modifiers) && it.declaringClass != Object }
            if (methods) {
                println "\n  -- methodes --"
                methods.sort { it.name }.each { m ->
                    def mods = java.lang.reflect.Modifier.toString(m.modifiers)
                    println "  ${mods} ${m.genericReturnType.typeName} ${m.name}(${m.genericParameterTypes*.typeName.join(', ')})"
                }
            }

            def nested = clazz.declaredClasses.findAll { java.lang.reflect.Modifier.isPublic(it.modifiers) }
            if (nested) {
                println "\n  -- classes imbriquees --"
                nested*.name.sort().each { println "  ${it}" }
            }
        }
    }
}
