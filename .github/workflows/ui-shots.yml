name: ui-shots
# Temporaire : lot 24c (postes en relief, liens Create et NTM NEXT). Serveur dedie
# avec NTM NEXT, Create Fly et JEI (recettes du mod chargees ?), puis client sous
# Xvfb ; pousse le tout sur shots-out.
on:
  push:
    branches: [tmp/shots-24c]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"
      - name: Paquets graphiques
        run: |
          if which Xvfb xvfb-run && ls /usr/lib/x86_64-linux-gnu/dri/swrast_dri.so /usr/lib/x86_64-linux-gnu/libgallium* 2>/dev/null | head -3; then
            echo "paquets graphiques deja presents"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          fi
      - name: NTM NEXT
        run: |
          git fetch -q --depth 1 origin ci/ntm
          mkdir -p /tmp/ntm run/mods
          git --work-tree=/tmp/ntm checkout FETCH_HEAD -- mods
          git reset -q
          cp /tmp/ntm/mods/hbm-neoforge-*.jar run/mods/
          ls -la run/mods
      - name: Create Fly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/fly
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/AtraxTerra/Mod-ported/releases/tags/server-latest -o /tmp/fly/release.json
          python3 - <<'PYR'
          import json
          release = json.load(open('/tmp/fly/release.json'))
          print(release.get('name'), release.get('published_at'))
          with open('/tmp/fly/assets.txt', 'w') as out:
              for asset in release.get('assets', []):
                  print(asset['name'], asset['size'])
                  out.write(asset['browser_download_url'] + '\n')
          PYR
          while read -r url; do curl -sSL -o "/tmp/fly/$(basename "$url")" "$url"; done < /tmp/fly/assets.txt
          cp /tmp/fly/*.jar run/mods/
      - name: JEI
        run: |
          python3 -I ci/fetch_modrinth.py /tmp/jei "jei=jei-26.2-neoforge-30.39.0.232.jar" \
            "mezz config=mezz_config-26.2-neoforge-0.6.6-standalone.jar"
          cp /tmp/jei/*.jar run/mods/
          ls -la run/mods
      - name: Monde et recettes
        run: |
          mkdir -p run/world/datapacks
          git fetch -q --depth 1 origin datapack-terre
          git show FETCH_HEAD:dohy_terre.zip > run/world/datapacks/dohy_terre.zip
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nenable-rcon=true\nrcon.password=shots\nrcon.port=25575\nlevel-seed=dohy\nlevel-type=minecraft\\:flat\nspawn-protection=0\n' > run/server.properties
          cat > /tmp/rcon.py <<'RCON'
          import socket, struct, sys
          s = socket.create_connection(("127.0.0.1", 25575), timeout=120)
          def send(kind, body, rid):
              data = struct.pack("<ii", rid, kind) + body.encode() + b"\x00\x00"
              s.sendall(struct.pack("<i", len(data)) + data)
              size = struct.unpack("<i", s.recv(4))[0]
              got = b""
              while len(got) < size:
                  got += s.recv(size - len(got))
              return got[8:-2].decode(errors="replace")
          send(3, "shots", 1)
          for number, command in enumerate(sys.argv[1:], 2):
              print("rcon>", command, "->", send(2, command, number)[:300])
          RCON
          ( timeout 1200 gradle runServer --no-daemon > /tmp/server.log 2>&1; echo "fin du serveur : $?" >> /tmp/server.log ) &
          for i in $(seq 1 180); do grep -qE 'Done \(|fin du serveur' /tmp/server.log && break; sleep 5; done
          grep -q 'Done (' /tmp/server.log || { grep -vE '^\s+at ' /tmp/server.log | tail -80; exit 1; }
          sleep 10
          python3 /tmp/rcon.py "dohyshots recettes U"
          sleep 5
          grep -n 'dohy-shots' /tmp/server.log | tail -20
          echo "--- erreurs de recettes ou de tags qui citent le mod ---"
          grep -niE "couldn't parse|parsing error|failed to (load|parse)|unknown recipe|invalid" /tmp/server.log | grep -iE "dohy" | head -40 || true
          python3 /tmp/rcon.py "stop" || true
          for i in $(seq 1 90); do grep -q 'fin du serveur' /tmp/server.log && break; sleep 2; done
          ls -la run/recettes-*.json || true
          mkdir -p run/saves && cp -r run/world run/saves/shots
      - name: Client
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          cp /tmp/ntm/mods/crankshaft-neoforge-*.jar run/mods/
          printf 'lang:fr_fr\nonboardAccessibility:false\nnarrator:0\ntutorialStep:none\njoinedFirstServer:true\nsoundCategory_master:0.0\nguiScale:0\nfullscreen:false\nrenderDistance:6\nsimulationDistance:6\n' > run/options.txt
          ( timeout 2700 xvfb-run -a -s "-screen 0 1920x1080x24" gradle runClient --no-daemon > /tmp/client.log 2>&1; echo "fin du client : $?" >> /tmp/client.log ) || true
          grep -nE "dohy-bug|dohy-shots: \[|ERROR|Exception|Caused by|fin du client|BUILD" /tmp/client.log | grep -v DEBUG | grep -v "Missing translations" | cut -c1-400 | head -400
          ls -la run/screenshots || true
      - name: Resume
        if: always()
        run: |
          python3 - <<'PY' | tee /tmp/resume.txt
          import json, os
          path = "run/recettes-U.json"
          if os.path.exists(path):
              data = json.load(open(path))
              print("mods", data.get("mods"))
              ours = data["recipes"]
              print(f"recettes du mod pour Create et NTM, chargees : {len(ours)}")
              for r in sorted(ours, key=lambda r: r["id"]):
                  flag = ""
                  if r.get("unknown") or r.get("empty_tags") or r.get("error"):
                      flag = f"  <-- {r.get('unknown')} {r.get('empty_tags')} {r.get('error')}"
                  print(f"  {r['id']:62s} {r['type']:28s} {', '.join(r['inputs'])} -> {', '.join(r['outputs'])}{flag}")
          else:
              print("pas de rapport de recettes")
          PY
      - name: Pousser
        if: always()
        run: |
          mkdir out && cp run/screenshots/*.png out/ 2>/dev/null || true
          cp /tmp/client.log out/client.log 2>/dev/null || true
          cp /tmp/server.log out/server.log 2>/dev/null || true
          cp run/recettes-*.json /tmp/resume.txt out/ 2>/dev/null || true
          cd out
          git init -q && git checkout -q -b shots-out && git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "shots ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" shots-out
