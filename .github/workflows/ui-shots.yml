name: ui-shots
# Temporaire : lance le client sous Xvfb avec NTM NEXT (branche ci/ntm),
# essaie Arrakis (NTM NEXT Space) et pousse les captures sur shots-out.
on:
  push:
    branches: [ci/shots]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"
      - name: Paquets graphiques
        run: |
          # L'image du runner a deja Xvfb et Mesa (llvmpipe) : les depots
          # d'Ubuntu ne sont consultes que s'ils manquent.
          if which Xvfb xvfb-run && ls /usr/lib/x86_64-linux-gnu/dri/swrast_dri.so /usr/lib/x86_64-linux-gnu/libgallium* 2>/dev/null | head -3; then
            echo "paquets graphiques deja presents"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          fi
      - name: NTM NEXT
        run: |
          git fetch -q --depth 1 origin ci/ntm
          mkdir -p /tmp/ntm run/mods
          git --work-tree=/tmp/ntm checkout FETCH_HEAD -- mods
          git reset -q
          cp /tmp/ntm/mods/hbm-neoforge-*.jar run/mods/
          cp /tmp/ntm/mods/hbmspace-neoforge-*.jar run/mods/
          ls -la run/mods
      - name: Utility Drawers
        run: |
          # Le fichier publie sur CurseForge (projet 1582712), celui que le
          # joueur installera : la liste des fichiers, puis le dernier en 26.2.
          mkdir -p /tmp/ud
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sS -L -A "$UA" -H "Accept: application/json" -o /tmp/ud/files.json -w "liste HTTP %{http_code}\n" \
            "https://www.curseforge.com/api/v1/mods/1582712/files?pageIndex=0&pageSize=20&sort=dateCreated&sortDescending=true&removeAlphas=false" || true
          head -c 600 /tmp/ud/files.json; echo
          python3 - <<'PY'
          import json
          files = json.load(open('/tmp/ud/files.json')).get('data', [])
          for f in files:
              print(f.get('id'), f.get('fileName'), f.get('fileLength'), f.get('gameVersions'),
                    f.get('dateCreated'), f.get('releaseType'))
          pick = next((f for f in files if '26.2' in (f.get('gameVersions') or [])), None)
          if pick is None:
              raise SystemExit('aucun fichier pour 26.2')
          open('/tmp/ud/pick', 'w').write('%s %s\n' % (pick['id'], pick['fileName']))
          PY
          read ID NAME < /tmp/ud/pick
          curl -sS -L -A "$UA" -o "/tmp/ud/$NAME" -w "jar HTTP %{http_code}\n" \
            "https://www.curseforge.com/api/v1/mods/1582712/files/$ID/download"
          ls -la /tmp/ud
          sha256sum "/tmp/ud/$NAME"
          python3 -c "import sys, zipfile; z = zipfile.ZipFile(sys.argv[1]); n = z.namelist(); print(len(n), 'entrees'); print(z.read('META-INF/neoforge.mods.toml').decode()[:3000])" "/tmp/ud/$NAME"
          cp "/tmp/ud/$NAME" run/mods/
          ls -la run/mods
      - name: Create Fly + Diesel Generators
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # La pre-version server-latest d'AtraxTerra/Mod-ported : les deux jars qui remplacent
          # Create: Adapted et Create: Diesel Generators Adapted sur le serveur.
          mkdir -p /tmp/fly
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/AtraxTerra/Mod-ported/releases/tags/server-latest -o /tmp/fly/release.json
          python3 - <<'PYR'
          import json
          release = json.load(open('/tmp/fly/release.json'))
          print(release.get('name'), release.get('published_at'), release.get('target_commitish'))
          with open('/tmp/fly/assets.txt', 'w') as out:
              for asset in release.get('assets', []):
                  print(asset['name'], asset['size'], asset['updated_at'])
                  out.write(asset['browser_download_url'] + '\n')
          PYR
          while read -r url; do curl -sSL -o "/tmp/fly/$(basename "$url")" "$url"; done < /tmp/fly/assets.txt
          ls -la /tmp/fly
          sha256sum /tmp/fly/*.jar
      - name: Create Fly, Flywheel deplace
        run: |
          # Le meme port, recompile avec son Flywheel embarque sous l'espace de noms
          # create_flywheel : ses shaders ne recouvrent plus ceux de CrankShaft.
          git clone -q --depth 1 -b port/neoforge-26.2 https://github.com/AtraxTerra/Mod-ported /tmp/flysrc
          git -C /tmp/flysrc log --oneline -1
          python3 -I ci/relocate_flywheel.py /tmp/flysrc
          chmod +x /tmp/flysrc/gradlew
          ( cd /tmp/flysrc && ./gradlew --no-daemon -q jar ) > /tmp/flybuild.log 2>&1 || { tail -60 /tmp/flybuild.log; exit 1; }
          tail -5 /tmp/flybuild.log
          mkdir -p /tmp/flyfix
          cp $(ls /tmp/flysrc/build/libs/create-fly-*.jar | grep -v -- '-sources' | head -1) /tmp/flyfix/
          ls -la /tmp/flyfix
          python3 -I -c "import sys, zipfile; n = zipfile.ZipFile(sys.argv[1]).namelist(); print(sum(x.startswith('assets/create_flywheel/') for x in n), 'create_flywheel ;', sum(x.startswith('assets/flywheel/') for x in n), 'flywheel')" /tmp/flyfix/*.jar
      - name: "Create: Adapted (phase A)"
        run: |
          # Ce que le serveur fait tourner aujourd'hui, memes fichiers.
          mkdir -p /tmp/adapted/mods /tmp/adapted/assets
          curl -fsSL -o /tmp/adapted/mods/create-adapted-26.2-1.31-public-external-assets.jar \
            https://mediafilez.forgecdn.net/files/9075/359/create-adapted-26.2-1.31-public-external-assets.jar \
            || curl -fsSL -o /tmp/adapted/mods/create-adapted-26.2-1.31-public-external-assets.jar \
            https://www.cursemaven.com/curse/maven/create-adapted-1651484/9075359/create-adapted-1651484-9075359.jar
          curl -fsSL -o /tmp/adapted/mods/createdieselgenerators-26.2-1.3.15-adapted-0.605.jar \
            https://mediafilez.forgecdn.net/files/8879/67/createdieselgenerators-26.2-1.3.15-adapted-0.605.jar
          curl -fsSL -o /tmp/adapted/assets/create-1.21.1-6.0.10.jar \
            https://api.modrinth.com/maven/maven/modrinth/LNytGWDc/UjX6dr61/LNytGWDc-UjX6dr61.jar
          ls -la /tmp/adapted/mods /tmp/adapted/assets
          sha256sum /tmp/adapted/mods/*.jar
      - name: Monde
        run: |
          mkdir -p run/world/datapacks
          # La Terre : calage, grille des pays, minerais retires, petrole interdit au hasard.
          cp ci-dohy_terre.zip run/world/datapacks/dohy_terre.zip
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nenable-rcon=true\nrcon.password=shots\nrcon.port=25575\nlevel-seed=dohy\nspawn-protection=0\n' > run/server.properties
          cat > /tmp/rcon.py <<'RCON'
          import socket, struct, sys
          s = socket.create_connection(("127.0.0.1", 25575), timeout=120)
          def send(kind, body, rid):
              data = struct.pack("<ii", rid, kind) + body.encode() + b"\x00\x00"
              s.sendall(struct.pack("<i", len(data)) + data)
              size = struct.unpack("<i", s.recv(4))[0]
              got = b""
              while len(got) < size:
                  got += s.recv(size - len(got))
              return got[8:-2].decode(errors="replace")
          send(3, "shots", 1)
          for number, command in enumerate(sys.argv[1:], 2):
              print("rcon>", command, "->", send(2, command, number)[:300])
          RCON
          cat > /tmp/nbt.py <<'NBT'
          import gzip, struct, sys
          raw = open(sys.argv[1], "rb").read()
          data = gzip.decompress(raw) if raw[:2] == b"\x1f\x8b" else raw
          pos = 0
          def take(n):
              global pos
              chunk = data[pos:pos + n]
              pos += n
              return chunk
          def name():
              (length,) = struct.unpack(">H", take(2))
              return take(length).decode("utf-8", "replace")
          def payload(kind):
              if kind == 1: return struct.unpack(">b", take(1))[0]
              if kind == 2: return struct.unpack(">h", take(2))[0]
              if kind == 3: return struct.unpack(">i", take(4))[0]
              if kind == 4: return struct.unpack(">q", take(8))[0]
              if kind == 5: return struct.unpack(">f", take(4))[0]
              if kind == 6: return struct.unpack(">d", take(8))[0]
              if kind == 7: return take(struct.unpack(">i", take(4))[0])
              if kind == 8: return name()
              if kind == 9:
                  inner = take(1)[0]
                  (count,) = struct.unpack(">i", take(4))
                  return [payload(inner) for _ in range(count)]
              if kind == 10:
                  out = {}
                  while True:
                      tag = take(1)[0]
                      if tag == 0: return out
                      key = name()
                      out[key] = payload(tag)
              if kind == 11:
                  (count,) = struct.unpack(">i", take(4))
                  return list(struct.unpack(">%di" % count, take(4 * count)))
              if kind == 12:
                  (count,) = struct.unpack(">i", take(4))
                  return list(struct.unpack(">%dq" % count, take(8 * count)))
              raise SystemExit("tag %d inconnu" % kind)
          kind = take(1)[0]
          name()
          root = payload(kind)
          def show(value, indent=""):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if isinstance(item, list):
                          print(indent + key, ": liste de", len(item))
                          for entry in item[:4]:
                              print(indent + "   ", entry)
                      elif isinstance(item, dict):
                          print(indent + key, ":")
                          show(item, indent + "  ")
                      else:
                          print(indent + key, "=", item)
          print(sys.argv[1], len(raw), "octets")
          show(root)
          NBT
          boot() {
            ( timeout 900 gradle runServer --no-daemon > "$1" 2>&1; echo "fin du serveur : $?" >> "$1" ) &
            for i in $(seq 1 120); do grep -qE 'Done \(|fin du serveur' "$1" && break; sleep 5; done
            grep -q 'Done (' "$1" || { grep -vE '^\s+at ' "$1" | tail -80; exit 1; }
          }
          halt() {
            python3 /tmp/rcon.py "stop" || true
            for i in $(seq 1 90); do grep -q 'fin du serveur' "$1" && break; sleep 2; done
          }
          oil() {
            find run/world -path '*createdieselgenerators*' -name '*.dat' | while read -r f; do python3 /tmp/nbt.py "$f"; done
          }
          # Phase A : Create: Adapted et son Diesel Generators, comme le serveur aujourd'hui.
          mkdir -p run/config/create-adapted/external-assets
          cp /tmp/adapted/assets/*.jar run/config/create-adapted/external-assets/
          cp /tmp/adapted/mods/*.jar run/mods/
          ls -la run/mods
          boot /tmp/server-A.log
          python3 /tmp/rcon.py "dohyshots load"
          for i in $(seq 1 24); do
            sleep 10
            python3 /tmp/rcon.py "dohyshots log" > /dev/null
            [ "$(grep 'charges, ' /tmp/server-A.log | tail -3 | grep -c ' 25 servis')" -ge 3 ] && break
          done
          python3 /tmp/rcon.py "dohyshots log" "save-all flush"
          sleep 8
          grep -n 'dohy-shots' /tmp/server-A.log | tail -12
          grep -niE 'petrole|Diesel Generators' /tmp/server-A.log | head -10
          halt /tmp/server-A.log
          echo "== petrole ecrit par Create: Adapted"; oil
          # Phase B : Create Fly (Flywheel deplace) et le port de Diesel Generators sur le meme monde.
          rm -f run/mods/create-adapted-*.jar run/mods/createdieselgenerators-*.jar
          rm -rf run/config/create-adapted
          cp /tmp/flyfix/create-fly-*.jar /tmp/fly/CreateDieselGenerators-*.jar run/mods/
          ls -la run/mods
          boot /tmp/server.log
          python3 /tmp/rcon.py "dohyshots log" "save-all flush"
          sleep 8
          grep -n 'dohy-shots' /tmp/server.log | tail -8
          halt /tmp/server.log
          echo "== petrole relu et reecrit par le port"; oil
          grep -nE 'Done \(|fin du serveur|ERROR' /tmp/server.log | head -20
          grep -nE 'FAILED during APPLY|was not applied|Mixin apply failed|InvalidMixin' /tmp/server.log | head -20
          grep -niE 'legacy|convert|migrat' /tmp/server.log | head -20
          grep -niE 'datapack|dohy_terre|biome_modifier' /tmp/server.log | head -20
          mkdir -p run/saves && cp -r run/world run/saves/shots && ls run/saves/shots
      - name: Client
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          cp /tmp/ntm/mods/crankshaft-neoforge-*.jar run/mods/
          printf 'lang:fr_fr\nonboardAccessibility:false\nnarrator:0\ntutorialStep:none\njoinedFirstServer:true\nsoundCategory_master:0.0\nguiScale:0\nfullscreen:false\nrenderDistance:10\nsimulationDistance:6\n' > run/options.txt
          ( timeout 2400 xvfb-run -a -s "-screen 0 1920x1080x24" gradle runClient --no-daemon > /tmp/client.log 2>&1; echo "fin du client : $?" >> /tmp/client.log ) || true
          grep -nE "dohy-shots|Guerre|ERROR|Exception|Caused by|fin du client|BUILD" /tmp/client.log | grep -v DEBUG | head -500
          grep -niE 'utilitydrawers|utility drawers|utility_drawers|Failed to create screen' /tmp/client.log | grep -v DEBUG | head -60
          grep -nE 'FAILED during APPLY|was not applied|Mixin apply failed|InvalidMixin' /tmp/client.log | head -20
          ls -la run/screenshots || true
      - name: Pousser
        if: always()
        run: |
          mkdir out && cp run/screenshots/*.png out/ 2>/dev/null || true
          cp /tmp/client.log out/client.log 2>/dev/null || true
          cp /tmp/server.log out/server.log 2>/dev/null || true
          cp /tmp/server-A.log out/server-A.log 2>/dev/null || true
          cp /tmp/flybuild.log out/flybuild.log 2>/dev/null || true
          cp /tmp/fly/release.json out/ 2>/dev/null || true
          cd out
          git init -q && git checkout -q -b shots-out && git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "shots ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" shots-out
