name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile le mod. C'est cette CI qui valide les signatures de l'API 26.2 :
  # NeoForge 26.2 est recent et les erreurs de compilation sont la seule facon
  # fiable de les verifier sans lancer le jeu.
  gradle:
    name: Compilation NeoForge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Gradle est epingle ici plutot que par un wrapper : le wrapper n'a pas pu
      # etre genere depuis l'environnement de dev (services.gradle.org injoignable).
      # A remplacer par ./gradlew des que le wrapper est commite.
      - name: Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Build
        run: gradle build --no-daemon --stacktrace

      # Le catalogue de prix est copie dans le jar au lieu d'etre duplique dans
      # les sources. Si cette copie casse silencieusement, le mod se charge mais
      # plus rien ne se vend — un symptome qui ne ressemble pas a sa cause.
      - name: Les donnees doivent etre dans le jar
        run: |
          JAR=$(ls build/libs/*.jar | head -1)
          MISSING=0
          # Les entrees palamod sont des temoins : si processResources changeait
          # et laissait les assets generes dehors, le mod se chargerait avec des
          # blocs sans texture ni butin au lieu d'echouer franchement.
          for f in data/dohy/prices.json data/dohy/collections.json data/dohy/job_progression.json data/dohy/tags/block/placement_exempt.json data/dohy/tags/block/crops.json data/dohy/contracts.json data/dohy/crates.json data/dohy/tag_prices.json data/dohy/economy.json data/dohy/museum.json data/dohy/upgrades.json data/dohy/jobs.json assets/palamod/items/paladium_ingot.json assets/palamod/models/item/paladium_ingot.json assets/palamod/textures/item/paladium_ingot.png assets/palamod/blockstates/paladium_ore.json assets/palamod/lang/fr_fr.json data/palamod/loot_table/blocks/paladium_ore.json data/palamod/recipe/paladium_ingot_from_particles.json data/palamod/worldgen/placed_feature/ore_paladium.json data/palamod/neoforge/biome_modifier/ores.json data/minecraft/tags/block/needs_diamond_tool.json assets/palamod/blockstates/kiwano_crop.json assets/palamod/models/block/kiwano_crop_stage_4.json assets/palamod/textures/block/kiwano_stage_4.png assets/palamod/items/kiwano_seeds.json data/palamod/loot_table/blocks/orangeblue_crop.json assets/palamod/blockstates/cobblebreaker.json assets/palamod/models/block/cobblebreaker_paladium.json assets/palamod/textures/block/crusher_front.png assets/palamod/items/cobblebreaker_titane_upgrade.json assets/dohy/textures/gui/kit/heat.png assets/dohy/font/title.json; do
            if ! unzip -l "$JAR" | grep -q "$f"; then
              echo "::error::$f est absent de $JAR"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            unzip -l "$JAR"
            exit 1
          fi
          echo "Donnees presentes dans $(basename "$JAR")"

      - name: Jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dohy-jar
          path: build/libs/*.jar
          if-no-files-found: warn

  # Garde-fou d'equilibrage : si rates.csv change sans que les fichiers generes
  # soient regeneres, le build echoue. Evite une data incoherente dans le depot.
  data:
    name: Coherence des donnees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # RealClock ne depend que de java.time : c'est le seul morceau du mod
      # verifiable autrement qu'en jeu, et celui ou une erreur de bascule ne se
      # verrait qu'a 5 h du matin trois jours plus tard.
      - name: L'horloge reelle doit passer son test
        run: |
          javac -d /tmp/clock \
            src/main/java/fr/atraxterra/dohy/util/RealClock.java \
            tools/RealClockTest.java
          java -cp /tmp/clock fr.atraxterra.dohy.util.RealClockTest

      - name: Regenerer les prix
        run: python3 tools/gen_prices.py

      - name: Les fichiers generes doivent etre a jour
        run: |
          if ! git diff --exit-code -- data/; then
            echo "::error::data/ n'est pas a jour. Lance 'python3 tools/gen_prices.py' et commite le resultat."
            exit 1
          fi

      # La table des metiers est generee depuis un jar absent du depot : la CI
      # ne peut pas la regenerer pour la comparer. Elle verifie donc ses
      # invariants, qui sont ce qui casserait le mod en silence — un metier mal
      # orthographie rend ses verrous inertes sans aucune erreur de compilation.
      - name: La table des metiers doit etre coherente
        run: |
          python3 - <<'PY'
          import json, sys
          jobs = json.load(open("data/jobs.json", encoding="utf-8"))
          progression = json.load(open("data/job_progression.json", encoding="utf-8"))
          max_level = progression["curve"]["max_level"]
          known = ("miner", "hunter", "farmer", "alchemist")

          errors = []
          for job in known:
              if job not in progression["jobs"]:
                  errors.append(f"metier « {job} » absent de job_progression.json")
          for job in progression["jobs"]:
              if job not in known:
                  errors.append(f"job_progression.json : metier inconnu « {job} »")

          seen = set()
          for entry in jobs["unlocks"]:
              key = (entry["job"], entry["id"])
              if entry["job"] not in known:
                  errors.append(f"{entry['id']} : metier inconnu « {entry['job']} »")
              if not 1 <= entry["level"] <= max_level:
                  errors.append(f"{entry['id']} : niveau {entry['level']} hors de 1..{max_level}")
              if not entry["id"].startswith("#") and ":" not in entry["id"]:
                  errors.append(f"{entry['id']} : identifiant sans namespace")
              if key in seen:
                  errors.append(f"{entry['id']} : deux entrees pour le meme metier")
              seen.add(key)

          # Une recompense hors de la courbe ne serait jamais donnee ; une
          # quantite nulle donnerait une pile vide sans le moindre message.
          for entry in jobs.get("rewards", []):
              label = f"recompense {entry['job']} {entry['level']} {entry['id']}"
              if entry["job"] not in known:
                  errors.append(f"{label} : metier inconnu")
              if not 1 <= entry["level"] <= max_level:
                  errors.append(f"{label} : niveau hors de 1..{max_level}")
              if ":" not in entry["id"] or entry["id"].startswith("#"):
                  errors.append(f"{label} : identifiant invalide")
              if entry.get("count", 1) < 1:
                  errors.append(f"{label} : quantite {entry.get('count')}")
              for enchant in entry.get("enchantments", []):
                  if ":" not in enchant["id"] or enchant["level"] < 1:
                      errors.append(f"{label} : enchantement {enchant}")

          print(f"{len(jobs['unlocks'])} deblocages et {len(jobs.get('rewards', []))} recompenses "
                f"coherents, niveaux dans 1..{max_level}")
          PY

      # Les trois controles qui suivent partagent une propriete : AUCUNE des
      # fautes qu'ils cherchent ne fait echouer la compilation. Chacune donne un
      # jar valide et un defaut qui n'apparait qu'en jeu. Chaque script est
      # lancable a la main ; son entete dit ce qu'il cherche.

      # Un verrou de metier ecrit sans l'exemption du creatif se charge sans
      # rien dire et bloque les administrateurs. Le chapitre 5 ajoutera des
      # verrous : ce controle existe pour cette omission-la.
      - name: Les verrous de metier doivent exempter le creatif
        run: python3 tools/check_job_gates.py

      # Un champ statique qui lit, via un appel de methode, un champ declare
      # plus bas : le compilateur ne voit rien (une lecture DIRECTE serait
      # refusee, l'appel de methode contourne la regle), le jar se construit, et
      # le jeu refuse de demarrer sur un ExceptionInInitializerError. C'est
      # arrive une fois ; ce controle est la pour que ce soit la derniere.
      - name: Les initialisations statiques doivent etre dans l'ordre
        run: python3 tools/check_static_init.py

      # La chaine d'assets palamod : enregistrement Java -> blockstate ->
      # modele -> texture, et definition d'item, butin, noms francais. Les
      # fautes ici donnent du violet, un bloc invisible ou un identifiant brut
      # affiche au joueur.
      - name: La chaine d'assets palamod doit etre complete
        run: python3 tools/check_assets.py

      # Le musee nomme ses pieces a la main, et le jeu ignore sans bruit celles
      # qu'il ne connait pas : une faute de frappe y passerait pour un mod absent.
      - name: Le musee ne doit nommer que des pieces qui existent
        run: python3 tools/check_museum.py

      # Les prix de l'agriculture changent chaque heure, objet par objet : une
      # recette ne doit pas devenir rentable quand ses ingredients sont au plus
      # bas et son produit au plus haut.
      - name: L'agriculture ne doit pas offrir d'argent gratuit
        run: python3 tools/check_agri_prices.py

      - name: Les JSON doivent parser
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path("data").rglob("*.json"):
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as exc:
                  bad.append(f"{p}: {exc}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("tous les JSON de data/ parsent")
          PY
